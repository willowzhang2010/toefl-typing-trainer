function generateAccountDeployCode(){
  const usersForExport = {};
  Object.entries(store.users).forEach(([uid, u])=>{
    usersForExport[uid] = {
      username: u.username,
      password: u.password,
      role: u.role,
      expireAt: u.expireAt || 'never',
      createdAt: u.createdAt || Date.now(),
    };
  });
  const data = { v:2, type:'account_deploy', users: usersForExport, ts: Date.now() };
  const json = JSON.stringify(data);
  const compressed = lzCompress(json);
  return 'TA' + compressed;
}
function parseAccountDeployCode(code){
  try{
    if(!code || !code.startsWith('TA')) return null;
    // Try v2: LZ compressed first
    const payload = code.substring(2);
    if(payload.length < 200){
      const json = lzDecompress(payload);
      if(json){
        const data = JSON.parse(json);
        if(data.users) return data;
      }
    }
    // Fallback v1: Base64
    const json = decodeURIComponent(escape(atob(payload)));
    const data = JSON.parse(json);
    if(!data.users) return null;
    return data;
  }catch(e){ return null; }
}

  const overlay = document.createElement('div');
  overlay.id = 'importAccountOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:var(--card);border-radius:12px;padding:24px;max-width:500px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.2)">
      <h3 style="margin:0 0 12px">📋 导入账号码</h3>
      <p style="font-size:.85rem;color:var(--muted);margin:0 0 12px">将管理员发给你的账号部署码粘贴到下方，导入后即可用你的指令码登录。</p>
      <textarea id="importCodeArea" placeholder="粘贴账号部署码（以 TA 开头）…" style="width:100%;height:100px;padding:10px;border:1px solid var(--rule);border-radius:8px;font-size:.82rem;font-family:monospace;resize:none;background:var(--bg);color:var(--ink)"></textarea>
      <div id="importErr" style="color:#ef4444;font-size:.82rem;margin-top:6px;min-height:20px"></div>
      <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
        <button onclick="applyAccountDeploy()" style="padding:8px 18px;border-radius:8px;background:var(--accent);color:#fff;border:none;cursor:pointer">确认导入</button>
        <button onclick="document.getElementById('importAccountOverlay').remove()" style="padding:8px 18px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--muted);cursor:pointer">取消</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}
function applyAccountDeploy(){
  const code = document.getElementById('importCodeArea').value.trim();
  const errEl = document.getElementById('importErr');
  const data = parseAccountDeployCode(code);
  if(!data){
    errEl.textContent = '部署码无效，请检查是否完整复制';
    return;
  }
  // Merge: replace existing users with deployed ones, keep admin if not in deploy
  const newUsers = {};
  Object.entries(data.users).forEach(([uid, u])=>{
    newUsers[uid] = defaultUserObj(u.username, u.role, u.expireAt);
    newUsers[uid].password = u.password;
    if(u.createdAt) newUsers[uid].createdAt = u.createdAt;
  });
  // If no admin in deploy code, keep local admin
  const hasAdmin = Object.values(newUsers).some(u=>u.role==='admin');
  if(!hasAdmin && store.users){
    Object.entries(store.users).forEach(([uid,u])=>{
      if(u.role==='admin') newUsers[uid] = u;
    });
  }
  store.users = newUsers;
  store.loginState = { fails:0, lockedUntil:0 };
  saveStore(store);
  const overlay = document.getElementById('importAccountOverlay');
  if(overlay) overlay.remove();
  toast('账号导入成功！请用你的指令码登录');
  renderLogin();
}

function enterApp(){
  document.getElementById('loginRoot').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  if(localStorage.getItem('toefl-dark')==='1') document.body.classList.add('dark');
  sidebarCollapsed = localStorage.getItem('toefl-sidebar-collapsed')==='1';
  renderNav();
  currentView = 'home';
  renderView();
  checkReminder();
}

// ===== SETUP (first run) =====
function renderSetup(){
  return `
    <div class="login-wrap">
      <div class="login-card" style="max-width:440px">
        <div class="logo">🎉</div>
        <h1>欢迎使用托福打字练习</h1>
        <p class="sub">首次使用，请创建管理员账号</p>
        <div class="setup-steps">
          <label>管理员用户名</label>
          <input type="text" id="setupName" placeholder="例如：admin" value="admin">
          <label>设置管理员指令码（至少 ${MIN_PWD_LEN} 位）</label>
          <input type="password" id="setupPwd" placeholder="请输入密码">
          <label>确认指令码</label>
          <input type="password" id="setupPwd2" placeholder="请再次输入密码">
          <label style="margin-top:16px">预置普通用户（可选，可后续添加）</label>
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <input type="text" id="user1Name" placeholder="用户名 1" value="学生1" style="flex:1">
            <input type="password" id="user1Pwd" placeholder="密码" style="flex:1">
          </div>
          <div style="display:flex;gap:8px">
            <input type="text" id="user2Name" placeholder="用户名 2" value="学生2" style="flex:1">
            <input type="password" id="user2Pwd" placeholder="密码" style="flex:1">
          </div>
          <label style="margin-top:12px">用户有效期</label>
          <select id="setupExpire" style="width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px">
            <option value="1y">1 年后</option>
            <option value="6m">6 个月后</option>
            <option value="3m">3 个月后</option>
            <option value="1m">1 个月后</option>
            <option value="never">永不过期</option>
          </select>
        </div>
        <button class="btn-login" id="setupBtn">完成设置，开始使用</button>
        <div class="err-msg" id="setupErr"></div>
      </div>
    </div>
  `;
}
function bindSetup(){
  setTimeout(()=>{
    document.getElementById('setupBtn').addEventListener('click', doSetup);
    document.getElementById('setupPwd2').addEventListener('keydown', e=>{if(e.key==='Enter')doSetup();});
  },0);
}
function doSetup(){
  const name = document.getElementById('setupName').value.trim();
  const pwd = document.getElementById('setupPwd').value;
  const pwd2 = document.getElementById('setupPwd2').value;
  const err = document.getElementById('setupErr');
  if(!name){err.textContent='请输入管理员用户名';return;}
  if(pwd.length < MIN_PWD_LEN){err.textContent=`密码至少 ${MIN_PWD_LEN} 位`;return;}
  if(pwd !== pwd2){err.textContent='两次密码不一致';return;}
  const expOpt = document.getElementById('setupExpire').value;
  const expireAt = computeExpire(expOpt);

  // Create admin
  const adminId = 'u_admin';
  store.users[adminId] = defaultUserObj(name, 'admin', 'never');
  store.users[adminId].password = hashPwd(pwd);

  // Create 2 initial users if passwords provided
  const u1name = document.getElementById('user1Name').value.trim();
  const u1pwd = document.getElementById('user1Pwd').value;
  const u2name = document.getElementById('user2Name').value.trim();
  const u2pwd = document.getElementById('user2Pwd').value;
  if(u1name && u1pwd.length >= MIN_PWD_LEN){
    const id = 'u_'+Date.now()+'_1';
    store.users[id] = defaultUserObj(u1name, 'user', expireAt);
    store.users[id].password = hashPwd(u1pwd);
  }
  if(u2name && u2pwd.length >= MIN_PWD_LEN){
    const id = 'u_'+Date.now()+'_2';
    store.users[id] = defaultUserObj(u2name, 'user', expireAt);
    store.users[id].password = hashPwd(u2pwd);
  }

  store.setupDone = true;
  store.currentUserId = adminId;
  saveStore(store);
  toast('设置成功！已用管理员身份登录');
  enterApp();
}
function computeExpire(opt){
  const d = new Date();
  switch(opt){
    case '1y': d.setFullYear(d.getFullYear()+1); break;
    case '6m': d.setMonth(d.getMonth()+6); break;
    case '3m': d.setMonth(d.getMonth()+3); break;
    case '1m': d.setMonth(d.getMonth()+1); break;
    case 'never': return 'never';
  }
  return d.toISOString().split('T')[0];
}
function computeExpireCustom(num, unit){
  const d = new Date();
  switch(unit){
    case 'day': d.setDate(d.getDate()+num); break;
    case 'month': d.setMonth(d.getMonth()+num); break;
    case 'year': d.setFullYear(d.getFullYear()+num); break;
    case 'never': return 'never';
  }
  return d.toISOString().split('T')[0];
}

renderLogin();
window.addEventListener('resize',()=>{if(currentView==='progress')drawProgressChart();});
