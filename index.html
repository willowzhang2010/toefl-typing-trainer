<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>托福写作打字练习</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1e293b;--muted:#64748b;--rule:#e2e8f0;--accent:#4f6ef7;--accent2:#22c55e;--accent-soft:rgba(79,110,247,.08);--warn:#f59e0b;--warning:#f59e0b;--warning-soft:#fffbeb;--danger:#ef4444;--danger-soft:#fef2f2;--purple:#8b5cf6;--page-brand-soft:#eff6ff;--radius:12px;--radius-sm:8px;--shadow:0 2px 12px rgba(0,0,0,.06)}
.dark{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--muted:#94a3b8;--rule:#334155;--accent:#6366f1;--accent2:#22c55e;--accent-soft:rgba(99,102,241,.15);--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--bg)}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea{font-family:inherit;outline:none}
.mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
.hidden{display:none!important}

/* ===== SIDEBAR LAYOUT ===== */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:240px;min-height:100vh;background:var(--card);border-right:1px solid var(--rule);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:transform .3s ease}
.sidebar-header{padding:20px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.sidebar-logo{font-weight:800;font-size:1.05rem;color:var(--accent);display:flex;align-items:center;gap:6px}
.sidebar-close{display:none;width:32px;height:32px;border-radius:8px;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:1.1rem}
.sidebar-user{padding:8px 16px 16px;border-bottom:1px solid var(--rule)}
.sidebar-user .su-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--accent-soft)}
.sidebar-user .su-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.sidebar-user .su-name{font-size:.85rem;font-weight:600;color:var(--ink)}
.sidebar-user .su-role{font-size:.7rem;color:var(--muted)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-group{margin-bottom:4px}
.nav-group-title{padding:10px 16px 4px;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:.85rem;color:var(--muted);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:var(--accent-soft);color:var(--accent)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent);font-weight:600}
.nav-item .nav-icon{font-size:1rem;width:20px;text-align:center}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--rule)}
.main{flex:1;margin-left:240px;padding:0;min-height:100vh;display:flex;flex-direction:column}
.main-scroll{flex:1;overflow-y:auto;padding:24px 28px 80px;max-width:960px;width:100%}
.main-header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--rule);padding:12px 28px;display:flex;align-items:center;justify-content:space-between}
.main-header .mh-title{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.main-header .mh-actions{display:flex;align-items:center;gap:10px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.sidebar-toggle{display:none;position:fixed;top:12px;left:12px;z-index:101;width:36px;height:36px;border-radius:8px;background:var(--card);border:1px solid var(--rule);align-items:center;justify-content:center;font-size:1.2rem;color:var(--ink)}

/* ===== SIDEBAR COLLAPSED ===== */
.sidebar.collapsed{width:64px;overflow:hidden}
.sidebar.collapsed .sidebar-logo{font-size:1.2rem}
.sidebar.collapsed .sidebar-header{padding:20px 8px 12px;justify-content:center}
.sidebar.collapsed .sidebar-user{padding:8px 8px 8px;border-bottom:1px solid var(--rule)}
.sidebar.collapsed .su-chip{justify-content:center;padding:6px}
.sidebar.collapsed .su-chip.collapsed .su-avatar{margin:0}
.sidebar.collapsed .sidebar-nav{padding:4px 0}
.sidebar.collapsed .nav-item{padding:9px 0;justify-content:center;gap:0;border-left:none}
.sidebar.collapsed .nav-item.active{border-left:none;background:var(--accent-soft)}
.sidebar.collapsed .nav-item .nav-icon{font-size:1.1rem;width:auto}
.sidebar.collapsed .nav-item .nav-label{display:none}
.sidebar.collapsed .nav-group-title{display:none}
.sidebar.collapsed .sidebar-footer{padding:8px}
.sidebar{transition:width .25s ease}
.main{transition:margin-left .25s ease}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-close{display:flex}
  .sidebar-overlay.show{display:block}
  .sidebar-toggle{display:flex}
  .main{margin-left:0!important}
  .main-scroll{padding:16px 12px 60px}
  .main-header{padding:12px 16px}
}

/* ===== HOME ===== */
.home-hero{text-align:center;padding:40px 0 32px}
.home-hero h1{font-size:1.8rem;margin-bottom:8px}
.home-hero p{color:var(--muted);font-size:.95rem}
.home-stats{display:flex;gap:16px;justify-content:center;margin:24px 0}
.home-stat{text-align:center}
.home-stat .v{font-size:1.6rem;font-weight:800;color:var(--accent)}
.home-stat .l{font-size:.75rem;color:var(--muted)}
.metric-row{display:grid;gap:12px;margin:16px 0}
.metric{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:16px;text-align:center}
.metric__value{font-size:1.5rem;font-weight:800;color:var(--accent);margin-bottom:4px}
.metric__label{font-size:.8rem;color:var(--muted)}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.module-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.module-card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.module-card .icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:12px}
.module-card h3{font-size:1rem;margin-bottom:4px}
.module-card p{font-size:.8rem;color:var(--muted);line-height:1.5}
.module-card .arrow{position:absolute;bottom:16px;right:16px;color:var(--accent);font-size:.8rem;opacity:0;transition:opacity .2s}
.module-card:hover .arrow{opacity:1}

/* ===== TYPING ===== */
.typing-area{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:24px}
.mode-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mode-tabs button{padding:6px 16px;border-radius:20px;font-size:.8rem;border:1px solid var(--rule);background:var(--card);color:var(--muted);transition:all .15s}
.mode-tabs button.active{background:var(--accent);color:#fff;border-color:transparent}
.typing-display{font-size:1.15rem;line-height:2.2;padding:20px;background:#fafbfc;border:1px solid var(--rule);border-radius:var(--radius-sm);min-height:120px;margin-bottom:16px;letter-spacing:.01em;white-space:pre-wrap;word-break:break-word}
.typing-display.direct-type{outline:none;cursor:text}
.typing-display.direct-type:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.tc{color:#cbd5e1;transition:color .05s}
.tc.ok{color:#16a34a}
.tc.bad{color:var(--danger);background:rgba(239,68,68,.08);border-radius:2px}
.tc.cur{background:var(--accent);color:#fff;border-radius:2px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.7}}
.typing-input-box{position:relative}
.typing-input{width:100%;padding:14px 16px;border:2px solid var(--rule);border-radius:var(--radius-sm);font-size:1rem;background:#fff;transition:border-color .15s}
.typing-input:focus{border-color:var(--accent)}
.realtime-stats{display:flex;gap:12px;margin-top:16px}
.rt-stat{flex:1;text-align:center;padding:12px 8px;background:#fafbfc;border:1px solid var(--rule);border-radius:var(--radius-sm)}
.rt-stat .v{font-size:1.5rem;font-weight:800;color:var(--accent)}
.rt-stat .l{font-size:.72rem;color:var(--muted)}
.para-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:.82rem;color:var(--muted)}
.para-nav button{padding:4px 12px;border-radius:16px;font-size:.78rem;border:1px solid var(--rule);background:var(--card);color:var(--muted)}
.para-nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.para-nav button:disabled{opacity:.4;cursor:default}

/* ===== PAUSE OVERLAY ===== */
.pause-overlay{position:absolute;inset:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;border-radius:var(--radius-sm);z-index:10}
.pause-overlay .pt{font-size:1.2rem;font-weight:700;color:var(--accent)}
.pause-overlay .ps{font-size:.85rem;color:var(--muted)}
.pause-overlay button{padding:8px 28px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-weight:600;font-size:.9rem}
.typing-display{position:relative}
.pause-btn{padding:6px 16px;border-radius:16px;font-size:.78rem;border:1px solid var(--rule);background:var(--card);color:var(--muted);transition:all .15s}
.pause-btn:hover{border-color:var(--accent);color:var(--accent)}
.typing-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

/* ===== LOGIN & SETUP ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#eef2ff 0%,#f0fdf4 100%)}
.dark .login-wrap{background:linear-gradient(135deg,#1e1b4b 0%,#052e16 100%)}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:var(--radius);padding:40px 32px;box-shadow:var(--shadow);text-align:center}
.login-card .logo{font-size:3rem;margin-bottom:8px}
.login-card h1{font-size:1.4rem;font-weight:700;margin-bottom:6px}
.login-card .sub{color:var(--muted);font-size:.85rem;margin-bottom:28px}
.login-card input{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:var(--radius-sm);font-size:.95rem;margin-bottom:12px;background:var(--bg);color:var(--ink)}
.login-card input:focus{border-color:var(--accent)}
.login-card .btn-login{width:100%;padding:12px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-weight:600;font-size:.95rem;margin-top:8px}
.login-card .btn-login:hover{opacity:.92}
.login-card .err-msg{color:var(--danger);font-size:.82rem;margin-top:8px;min-height:20px}
.login-card .hint{font-size:.75rem;color:var(--muted);margin-top:16px;line-height:1.6}
.lock-info{padding:10px 14px;background:#fef2f2;border-radius:var(--radius-sm);font-size:.82rem;color:var(--danger);margin-bottom:12px}
.dark .lock-info{background:#450a0a}
.setup-steps{margin-bottom:24px;text-align:left}
.setup-steps h3{font-size:.95rem;margin-bottom:10px}
.setup-steps label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px;margin-top:12px}

/* ===== TOP BAR ===== */
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--rule);padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-left .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:6px}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:20px;background:var(--accent-soft);font-size:.8rem;font-weight:600;color:var(--accent)}
.user-chip .avatar{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700}
.icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--muted);font-size:1rem}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}

/* ===== ADMIN PANEL ===== */
.admin-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--rule)}
.admin-tab{padding:10px 16px;font-size:.85rem;color:var(--muted);border-bottom:2px solid transparent;background:none;cursor:pointer}
.admin-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.user-row{display:flex;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius-sm);margin-bottom:10px;gap:12px;flex-wrap:wrap}
.user-row .u-name{font-weight:600;flex:1;min-width:100px}
.user-row .u-role{font-size:.72rem;padding:3px 10px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.user-row .u-role.admin{background:#fef3c7;color:#d97706}
.dark .user-row .u-role.admin{background:#78350f;color:#fcd34d}
.user-row .u-expire{font-size:.78rem;color:var(--muted);min-width:130px}
.user-row .u-expire.warn{color:var(--warn)}
.user-row .u-expire.danger{color:var(--danger)}
.user-row .u-actions{display:flex;gap:6px}
.user-row .u-actions button{padding:5px 10px;border-radius:6px;font-size:.75rem;border:1px solid var(--rule);background:var(--bg);color:var(--muted)}
.user-row .u-actions button:hover{border-color:var(--accent);color:var(--accent)}
.user-row .u-actions button.del:hover{border-color:var(--danger);color:var(--danger)}
.add-user-form{padding:16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius-sm);margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.add-user-form label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:4px}
.add-user-form input,.add-user-form select{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font-size:.85rem;background:var(--bg);color:var(--ink)}
.add-user-form button{padding:9px 16px;border-radius:6px;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600}
@media(max-width:640px){.add-user-form{grid-template-columns:1fr}}

/* ===== DASHBOARD / HOME ===== */
.home-top{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:768px){.home-top{grid-template-columns:1fr}}
.goal-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:24px}
.goal-card h3{font-size:1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.goal-bar{width:100%;height:12px;background:var(--rule);border-radius:6px;overflow:hidden;margin:8px 0}
.goal-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .5s ease}
.goal-info{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.goal-info .done{color:var(--accent2);font-weight:600}
.streak-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:24px;text-align:center}
.streak-num{font-size:3rem;font-weight:800;background:linear-gradient(135deg,var(--warn),var(--danger));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.streak-label{font-size:.85rem;color:var(--muted);margin-top:4px}
.streak-flame{font-size:2.5rem;margin-bottom:4px}
.calendar-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.calendar-mini .day{aspect-ratio:1;border-radius:4px;background:var(--rule);font-size:.65rem;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.calendar-mini .day.active{background:var(--accent2);color:#fff;font-weight:600}
.calendar-mini .day.today{border:2px solid var(--accent)}

/* ===== BADGES ===== */
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:16px}
.badge-item{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:16px 10px;text-align:center;transition:all .2s}
.badge-item.locked{opacity:.35;filter:grayscale(1)}
.badge-item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.badge-icon{font-size:2rem;margin-bottom:6px}
.badge-name{font-size:.78rem;font-weight:600;margin-bottom:2px}
.badge-desc{font-size:.7rem;color:var(--muted);line-height:1.4}

/* ===== WRONG NOTEBOOK ===== */
.wrong-item{padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius-sm);margin-bottom:10px;display:flex;align-items:center;gap:12px}
.wrong-item .w-word{font-weight:600;flex:1;font-family:var(--mono-font,monospace)}
.wrong-item .w-count{font-size:.78rem;color:var(--danger);background:#fef2f2;padding:3px 10px;border-radius:12px;font-weight:600}
.dark .wrong-item .w-count{background:#450a0a}
.wrong-item .w-actions button{padding:5px 12px;border-radius:6px;font-size:.75rem;background:var(--accent);color:#fff;border:none}

/* ===== SHUFFLE TOGGLE ===== */
.shuffle-toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--rule);font-size:.78rem;cursor:pointer;color:var(--muted);margin-left:auto}
.shuffle-toggle.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* ===== DATA TOOLS ===== */
.data-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.data-tools button{padding:8px 14px;border-radius:6px;font-size:.82rem;border:1px solid var(--rule);background:var(--card);color:var(--muted)}
.data-tools button:hover{border-color:var(--accent);color:var(--accent)}

/* ===== REMINDER SETTINGS ===== */
.reminder-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius-sm);margin-bottom:8px}
.reminder-row .r-info{font-size:.88rem}
.reminder-row .r-info small{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
.switch{position:relative;width:44px;height:24px;border-radius:12px;background:var(--rule);cursor:pointer;transition:all .2s}
.switch.on{background:var(--accent2)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:all .2s}
.switch.on::after{left:22px}

/* ===== SENTENCES ===== */
.sent-card{padding:16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s}
.sent-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.sent-card .st{font-size:.9rem;line-height:1.6;margin-bottom:8px;font-style:italic;color:var(--ink)}
.sent-card .sm{font-size:.76rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.sent-card .sg{font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.sent-practice{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:28px}
.sent-display{font-size:1.15rem;line-height:2;padding:20px;background:#fafbfc;border:1px solid var(--rule);border-radius:var(--radius-sm);min-height:80px;margin-bottom:16px}
.sent-progress{margin-top:16px;text-align:center;font-size:.85rem;color:var(--muted)}
.sent-bar{width:80%;height:6px;background:var(--rule);border-radius:3px;margin:8px auto 0;overflow:hidden}
.sent-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

/* ===== VOCAB ===== */
.vocab-area{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:32px;text-align:center}
.vocab-word{font-size:2.5rem;font-weight:800;margin:16px 0 4px;letter-spacing:.02em}
.vocab-def{font-size:.95rem;color:var(--muted);margin-bottom:12px}
.vocab-ex{font-size:.9rem;color:var(--ink);font-style:italic;background:var(--accent-soft);border-radius:var(--radius-sm);padding:10px 16px;margin:0 auto 20px;max-width:520px;line-height:1.6;text-align:left}
.vocab-ex .el{font-style:normal;font-weight:700;color:var(--accent);font-size:.75rem;margin-right:4px}
.vocab-input{width:300px;padding:10px 16px;border:2px solid var(--rule);border-radius:var(--radius-sm);font-size:1.1rem;text-align:center;background:#fff;transition:border-color .15s}
.vocab-input:focus{border-color:var(--accent)}
.vocab-input.err{border-color:var(--danger)}
.vocab-prog{margin-top:20px;font-size:.85rem;color:var(--muted)}

  {id:'e1',type:'independent',title:'Students should take physical education courses',topic:'教育',wordCount:368,
   content:`In today's fast-paced academic environment, many universities prioritize intellectual development over physical well-being. However, I firmly believe that students should be required to take physical education courses in college, as these classes promote overall health, reduce academic stress, and teach valuable life skills.

First and foremost, physical education courses are essential for maintaining students' health. Many college students spend hours sitting in classrooms or hunched over laptops, leading to poor posture and a sedentary lifestyle. Regular physical activity through structured courses ensures that students exercise at least a few times each week. Research has consistently shown that physical activity strengthens the immune system, improves cardiovascular health, and helps prevent chronic diseases. By requiring these courses, universities can help students build healthy habits that will benefit them throughout their lives.

Furthermore, physical education serves as an effective stress reliever. College students face enormous pressure from exams, assignments, and social expectations. Engaging in sports or exercise releases endorphins, which are natural mood elevators. Many students find that a workout session helps them return to their studies with renewed focus and energy. In this way, physical education is not a distraction from academics but rather a complement to them.

Additionally, these courses teach important life skills such as teamwork, discipline, and time management. Through team sports, students learn to cooperate with others, communicate effectively, and handle both victory and defeat gracefully. These qualities are invaluable in professional settings and personal relationships alike. Individual sports, on the other hand, foster self-discipline and goal-setting habits that translate directly to academic and career success.

Some critics argue that physical education takes time away from academic pursuits. However, this view is short-sighted. The time spent on physical education is an investment in a student's overall well-being, which ultimately enhances academic performance. A healthy, focused student will always outperform one who is exhausted and stressed.

In conclusion, requiring physical education courses in college is a wise policy that benefits students in multiple ways. By promoting health, reducing stress, and building character, these courses prepare students not just for careers but for life. Universities should embrace this holistic approach to education.`},

  {id:'e2',type:'integrated',title:'Group wisdom: reading vs. lecture',topic:'社会学',wordCount:412,
   content:`The reading passage discusses the concept of collective intelligence, suggesting that groups make better decisions than individuals. According to the author, when diverse perspectives combine, the resulting decisions are more accurate and innovative. The passage cites several studies showing that crowds can estimate quantities with remarkable precision and that teams outperform solo problem solvers.

However, the lecture challenges this optimistic view of group wisdom. The professor argues that collective intelligence has significant limitations that the reading fails to address.

First, the lecture points out that groups are prone to conformity bias. When people make decisions in groups, they often suppress their own opinions to align with the majority. This phenomenon, known as groupthink, can lead to poor decisions rather than better ones. The professor describes an experiment where participants changed their correct answers to match the incorrect responses of others, demonstrating that social pressure can undermine the benefits of collective decision-making.

Second, the reading claims that diversity improves group performance. Yet the lecture counters that diversity alone is insufficient. Without proper facilitation and a culture that encourages dissenting voices, diverse groups may actually perform worse than homogeneous ones. The professor notes that dominant individuals often hijack group discussions, regardless of whether their ideas are the best.

Finally, the reading suggests that technology has enhanced collective intelligence through online platforms. The lecture acknowledges this point but warns that online environments amplify misinformation. When false information spreads rapidly through networks, the collective output becomes less reliable, not more. The professor cites examples of viral rumors that misled large numbers of people, proving that technology can magnify the weaknesses of group decision-making.

In summary, while the reading presents an idealized view of collective intelligence, the lecture provides compelling evidence that groups are susceptible to conformity, dominance, and misinformation. These factors can make collective decisions worse rather than better.`},

  {id:'e3',type:'independent',title:'Technology makes people less creative',topic:'科技',wordCount:345,
   content:`The rapid advancement of technology has transformed nearly every aspect of modern life. Some people argue that technology stifles creativity by making us overly dependent on devices and algorithms. However, I disagree with this claim. In my view, technology actually enhances human creativity by providing powerful tools, facilitating collaboration, and freeing up time for deeper thinking.

To begin with, technology gives people access to creative tools that were previously available only to professionals. Digital art software allows anyone with a computer to create stunning illustrations and designs. Music production apps enable aspiring musicians to compose and record songs without expensive studio equipment. Writing platforms with research databases help authors find inspiration and organize their ideas efficiently. These tools lower the barrier to creative expression and encourage more people to explore their artistic potential.

Additionally, technology facilitates collaboration among creative individuals. Through online platforms, writers, artists, and musicians can share their work with a global audience and receive feedback in real time. Crowdsourcing projects bring together talents from different backgrounds to solve problems collectively. This exchange of ideas sparks inspiration and pushes creative boundaries in ways that isolated work cannot achieve. The cross-pollination of perspectives often leads to breakthrough innovations.

Moreover, technology automates repetitive tasks, freeing up mental energy for creative pursuits. Before the digital age, people spent countless hours on manual calculations, data entry, and administrative chores. Today, software handles these mundane activities, allowing individuals to devote more time and attention to imaginative work. When the brain is not exhausted by routine tasks, it is better equipped to generate original ideas.

Critics may point out that excessive screen time and constant notifications fragment our attention. While this is a valid concern, it is a problem of usage habits rather than technology itself. When used mindfully, digital tools become catalysts for creativity rather than obstacles.

In conclusion, technology does not diminish human creativity. On the contrary, it provides powerful tools, connects creative minds, and frees us from drudgery. The key lies in using technology as an enabler rather than a crutch. With the right approach, technology and creativity can thrive together.`},

  {id:'e4',type:'integrated',title:'Remote learning: reading vs. lecture',topic:'教育',wordCount:356,
   content:`The reading passage argues that remote learning is an effective alternative to traditional classroom education. It claims that online courses offer flexibility, reduce costs, and provide access to high-quality educational resources regardless of geographic location. The passage highlights that students can learn at their own pace and review materials as many times as needed.

However, the lecture presents a different perspective, arguing that remote learning has serious drawbacks that limit its educational value.

First, the reading emphasizes the flexibility of online learning. The lecture acknowledges this point but argues that flexibility often leads to procrastination. Without the structure of regular class meetings, many students struggle to stay motivated and fall behind. The professor cites a study showing that completion rates for online courses are significantly lower than those for in-person classes.

Second, the reading claims that remote learning reduces costs. While the lecture agrees that tuition may be lower, it points out hidden costs. Students need reliable computers and internet connections, which not everyone can afford. Additionally, remote learners miss out on networking opportunities and campus resources that add significant value to the educational experience.

Finally, the reading suggests that online education provides access to quality resources. The professor counters that the lack of face-to-face interaction diminishes the learning experience. In a physical classroom, students can ask questions, engage in discussions, and receive immediate feedback. These interactions deepen understanding and build critical thinking skills that are difficult to replicate online. Furthermore, the social skills developed through in-person learning are essential for professional success.

In conclusion, while remote learning offers certain advantages in terms of flexibility and accessibility, the lecture demonstrates that it cannot fully replace traditional classroom education. The lack of structure, hidden costs, and missing social interaction make online learning less effective for many students.`},

  {id:'e5',type:'email',title:'Requesting leave for an academic conference',topic:'校园场景',wordCount:118,
   content:`Dear Professor Johnson,

I am writing to inform you that I will need to miss your Introduction to Linguistics class on October 15th. I have been selected to present my research paper at the Annual Student Academic Conference, which takes place on the same day.

I understand that this is an important lecture, so I have already arranged to borrow notes from my classmate, Sarah. I will also review the assigned readings and complete any homework before the following class.

Could you please let me know if there is any additional material I should review? I am happy to submit any assignments early if that would be helpful.

Thank you for your understanding. I look forward to returning to class on October 17th.

Sincerely,
Alex Chen`},

  {id:'e6',type:'debate',title:'Foreign language requirement debate',topic:'教育',wordCount:127,
   content:`The question of whether universities should require all students to take a foreign language course has sparked considerable debate. After reviewing my classmates' perspectives, I believe that foreign language education should remain a requirement, though with some flexibility.

Student A argues that learning a foreign language broadens cultural understanding and improves career prospects. I agree with this point strongly. In our increasingly interconnected world, the ability to communicate in multiple languages is a valuable professional skill. Many employers specifically seek candidates who can engage with international clients.

Student B counters that STEM students should focus on technical skills instead. While I understand this concern, I believe the two are not mutually exclusive. Language courses develop critical thinking and communication skills that benefit scientists and engineers as well.

Therefore, universities should require foreign language courses but could offer condensed options for students in demanding technical programs.`},

function hashPwd(pwd){
  let h = 5381;
  for(let i=0;i<pwd.length;i++){ h = ((h<<5)+h) + pwd.charCodeAt(i); h |= 0; }
  return 'h'+(h>>>0).toString(36)+pwd.length;
}

// ==================== LZ-STRING COMPRESSION ====================
// Lightweight LZ-based compression for shortening share codes
function lzCompress(input){
  if(input==null) return '';
  let i, j, res = [], dictionary = {}, c, wc, w = '', enlargeIn = 2, dictSize = 256, numBits = 8;
  const data = [];
  let data_val = 0, data_position = 0;
  const String = {fromCharCode: String.fromCharCode};
  for(i=0;i<input.length;i++){
    c = input.charCodeAt(i);
    if(dictionary[c]===undefined){ dictionary[c] = dictSize++; }
    wc = w+String.fromCharCode(c);
    if(dictionary[wc]!==undefined){ w = wc; }
    else {
      // output w code
      const w_code = dictionary[w];
      for(j=0;j<numBits;j++){
        data_val = (data_val<<1) | ((w_code>>>(numBits-1-j))&1);
        data_position++;
        if(data_position===16){ data_position=0; data.push(data_val); data_val=0; }
      }
      enlargeIn--;
      if(enlargeIn===0){ enlargeIn = Math.pow(2,numBits); numBits++; }
      dictionary[wc] = dictSize++;
      w = String.fromCharCode(c);
    }
  }
  if(w!==''){
    const w_code = dictionary[w];
    for(j=0;j<numBits;j++){
      data_val = (data_val<<1) | ((w_code>>>(numBits-1-j))&1);
      data_position++;
      if(data_position===16){ data_position=0; data.push(data_val); data_val=0; }
    }
    enlargeIn--;
    if(enlargeIn===0){ enlargeIn = Math.pow(2,numBits); numBits++; }
  }
  // flush
  if(data_position>0){
    while(data_position<16){ data_val = (data_val<<1); data_position++; }
    data.push(data_val);
  }
  // Convert to base64-like string using custom alphabet
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  let result = '';
  for(i=0;i<data.length;i++){
    const code = data[i];
    result += chars[(code>>10)&63] + chars[(code>>4)&63] + chars[code&15];
  }
  return result;
}
function lzDecompress(compressed){
  if(!compressed || compressed.length===0) return '';
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  const charMap = {};
  for(let i=0;i<chars.length;i++) charMap[chars[i]] = i;
  // Decode from base64-like string to 16-bit data array
  const data = [];
  for(let i=0;i<compressed.length;i+=3){
    const c1 = charMap[compressed[i]]||0;
    const c2 = charMap[compressed[i+1]]||0;
    const c3 = charMap[compressed[i+2]]||0;
    data.push((c1<<10)|(c2<<4)|c3);
  }
  // Decompress
  const dictionary = [];
  let enlargeIn = 2, dictSize = 256, numBits = 8;
  let data_idx = 0, data_bit = 0;
  function readBits(count){
    let result = 0;
    for(let i=0;i<count;i++){
      result = (result<<1) | ((data[data_idx]>>>(15-data_bit))&1);
      data_bit++;
      if(data_bit===16){ data_bit=0; data_idx++; }
    }
    return result;
  }
  let w = String.fromCharCode(readBits(8));
  let result = w;
  let c, entry;
  dictionary[256] = 0; // placeholder
  while(true){
    if(data_idx >= data.length) break;
    const code = readBits(numBits);
    if(code===dictSize){ dictionary[dictSize++] = w+w[0]; }
    if(code < dictSize){
      entry = code < 256 ? String.fromCharCode(code) : (dictionary[code]||'');
    } else {
      entry = w+w[0];
    }
    if(!entry) break;
    result += entry;
    dictionary[dictSize++] = w + entry[0];
    w = entry;
    enlargeIn--;
    if(enlargeIn===0){ enlargeIn = Math.pow(2,numBits); numBits++; }
    if(data_idx >= data.length) break;
  }
  return result;
}

function checkBadges(){
  const u = getCurrentUser();
  if(!u) return;
  const stats = u.stats;
  const practices = u.practices || [];
  const bestWpm = practices.reduce((m,p)=>Math.max(m,p.wpm||0),0);
  const bestAcc = practices.reduce((m,p)=>Math.max(m,p.accuracy||0),0);
  const wrongCount = (u.wrongNotebook||[]).length;
  const check = (id, cond) => {
    if(cond && !u.badges[id]){
      u.badges[id] = new Date().toISOString();
      setTimeout(()=>toast('🎉 解锁徽章：'+BADGES.find(b=>b.id===id)?.name), 800);
    }
  };
  check('first_practice', practices.length >= 1);
  check('streak_3', stats.streak >= 3);
  check('streak_7', stats.streak >= 7);
  check('streak_30', stats.streak >= 30);
  check('wpm_20', bestWpm >= 20);
  check('wpm_30', bestWpm >= 30);
  check('wpm_50', bestWpm >= 50);
  check('acc_95', bestAcc >= 95);
  check('acc_99', bestAcc >= 99);
  check('total_10k', stats.totalChars >= 10000);
  check('total_100k', stats.totalChars >= 100000);
  check('sessions_50', practices.length >= 50);
  check('essay_full', practices.some(p => p.mode === '整篇练习'));
  check('exam_mode', practices.some(p => p.mode?.includes('考试')));
  check('wrong_10', wrongCount >= 10);
  saveStore(store);
}

function addPracticeRecord(record){
  const u = getCurrentUser();
  if(!u) return;
  u.practices.push(record);
  saveStore(store);
  updateStreakAndStats(record.duration||0, record.totalChars||0);
}
function updateStreakAndStats(durationSec, charCount){
  const u = getCurrentUser();
  if(!u) return;
  const today = new Date().toLocaleDateString('zh-CN');
  const stats = u.stats;
  stats.totalTime += durationSec;
  stats.totalChars += charCount;
  stats.totalSessions = (stats.totalSessions||0) + 1;
  stats.dailyMinutes[today] = (stats.dailyMinutes[today]||0) + durationSec/60;
  // streak logic
  if(stats.lastActiveDate !== today){
    const yest = new Date(Date.now()-86400000).toLocaleDateString('zh-CN');
    if(stats.lastActiveDate === yest){
      stats.streak++;
    }else if(!stats.lastActiveDate){
      stats.streak = 1;
    }else{
      stats.streak = 1;
    }
    stats.lastActiveDate = today;
  }
  saveStore(store);
  checkBadges();
}

function renderNav(){
  const el = document.getElementById('navInner');
  const u = getUserData();
  const isAdmin = u && u.role === 'admin';
  // Filter items by adminOnly
  const items = NAV_ITEMS.filter(n=> !n.adminOnly || isAdmin);
  // Group items
  const groups = {};
  items.forEach(n=>{
    if(!groups[n.group]) groups[n.group]=[];
    groups[n.group].push(n);
  });
  const collapsed = sidebarCollapsed;
  let navHtml = '';
  // Main group (home) without group title
  if(groups['main']){
    navHtml += groups['main'].map(n=>
      `<div class="nav-item ${n.id===currentView?'active':''}" onclick="navigate('${n.id}')" title="${n.label}"><span class="nav-icon">${n.icon}</span><span class="nav-label">${n.label}</span></div>`
    ).join('');
  }
  // Other groups with titles
  const groupOrder = ['practice','exam','analysis','feedback','mine'];
  const groupLabels = {practice:'Practice 练习', exam:'⏱️ 模拟考试', analysis:'错题分析', feedback:'Feedback 反馈', mine:'👤 我的'};
  groupOrder.forEach(g=>{
    if(!groups[g]) return;
    navHtml += `<div class="nav-group"><div class="nav-group-title">${collapsed?'':groupLabels[g]||g}</div>`;
    navHtml += groups[g].map(n=>
      `<div class="nav-item ${n.id===currentView?'active':''}" onclick="navigate('${n.id}')" title="${n.label}"><span class="nav-icon">${n.icon}</span><span class="nav-label">${n.label}</span></div>`
    ).join('');
    navHtml += `</div>`;
  });
  el.innerHTML = navHtml;

  // Apply collapsed state to sidebar element
  const sb = document.getElementById('sidebar');
  if(sb){
    sb.classList.toggle('collapsed', collapsed);
  }
  const mainEl = document.querySelector('.main');
  if(mainEl){
    mainEl.style.marginLeft = collapsed ? '64px' : '240px';
  }

  // Render sidebar user
  const suEl = document.getElementById('sidebarUser');
  if(suEl && u){
    const initials = (u.username||'U').substring(0,2).toUpperCase();
    if(collapsed){
      suEl.innerHTML = `<div class="su-chip collapsed"><div class="su-avatar">${initials}</div></div>`;
    } else {
      suEl.innerHTML = `
        <div class="su-chip">
          <div class="su-avatar">${initials}</div>
          <div>
            <div class="su-name">${u.username||'用户'}</div>
            <div class="su-role">${u.role==='admin'?'管理员':'普通用户'}</div>
          </div>
        </div>
      `;
    }
  }

  // Render sidebar footer - collapse button + logout
  const sfEl = document.getElementById('sidebarFooter');
  if(sfEl){
    if(collapsed){
      sfEl.innerHTML = `
        <button onclick="toggleSidebarCollapse()" title="展开侧栏" style="width:100%;padding:8px 0;border-radius:8px;background:var(--bg);color:var(--muted);font-size:.7rem;border:1px solid var(--rule)">»</button>
      `;
    } else {
      sfEl.innerHTML = `
        <div style="display:flex;gap:6px">
          <button onclick="toggleSidebarCollapse()" title="折叠侧栏" style="flex:1;padding:8px;border-radius:8px;background:var(--bg);color:var(--muted);font-size:.82rem;border:1px solid var(--rule)">« 折叠</button>
          <button onclick="logout()" style="flex:1;padding:8px;border-radius:8px;background:var(--bg);color:var(--muted);font-size:.82rem;border:1px solid var(--rule)">退出</button>
        </div>
      `;
    }
  }

  // Render main header
  const mhEl = document.getElementById('mainHeader');
  if(mhEl){
    const title = VIEW_TITLES[currentView] || '';
    mhEl.innerHTML = `
      <div class="mh-title">${title}</div>
      <div class="mh-actions" id="headerActions"></div>
    `;
    renderHeaderActions();
  }
}
function renderHeaderActions(){
  const el = document.getElementById('headerActions');
  if(!el) return;
  const u = getUserData();
  let html = '';
  // Dark mode toggle
  html += `<button class="icon-btn" onclick="toggleDark()" title="切换主题">🌙</button>`;
  // User chip
  if(u){
    const initials = (u.username||'U').substring(0,2).toUpperCase();
    html += `<div class="user-chip"><div class="avatar">${initials}</div>${u.username||'用户'}</div>`;
  }
  el.innerHTML = html;
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function toggleSidebarCollapse(){
  sidebarCollapsed = !sidebarCollapsed;
  localStorage.setItem('toefl-sidebar-collapsed', sidebarCollapsed?'1':'0');
  renderNav();
}
function toggleDark(){
  document.body.classList.toggle('dark');
  localStorage.setItem('toefl-dark', document.body.classList.contains('dark')?'1':'0');
  renderView();
}
function logout(){
  if(!confirm('确定退出登录？')) return;
  store.currentUserId = null;
  if(store.loginState) store.loginState.currentUser = null;
  saveStore(store);
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginRoot').style.display = '';
  renderLogin();
}

function navigate(view){
  // Admin access control
  if(view === 'admin'){
    const u = getUserData();
    if(!u || u.role !== 'admin'){
      toast('无权限访问管理员面板');
      return;
    }
  }
  currentView = view;
  renderNav();
  renderView();
  window.scrollTo(0,0);
}

function renderView(){
  const app = document.getElementById('app');
  switch(currentView){
    case 'home': app.innerHTML=renderHome(); bindHome(); break;
    case 'library': app.innerHTML=renderLibrary(); bindLibrary(); break;
    case 'sentences': renderSentences(); break;
    case 'typing': renderTyping(); break;
    case 'vocab': renderVocab(); break;
    case 'wrongbook': app.innerHTML=renderWrongBook(); bindWrongBook(); break;
    case 'keyboard': renderKeyboard(); break;
    case 'exam': renderExam(); break;
    case 'badges': app.innerHTML=renderBadges(); break;
    case 'history': app.innerHTML=renderHistory(); bindHistory(); break;
    case 'progress': app.innerHTML=renderProgress(); setTimeout(drawProgressChart,50); break;
    case 'personalReport': app.innerHTML=renderPersonalReport(); setTimeout(drawReportChart,50); break;
    case 'errors': app.innerHTML=renderErrors(); bindErrors(); break;
    case 'report': app.innerHTML=renderReport(); bindReport(); break;
    case 'admin': app.innerHTML=renderAdmin(); bindAdmin(); setTimeout(()=>{if(adminTab==='dashboard')drawDashboardChart()},50); break;
    case 'settings': app.innerHTML=renderSettings(); bindSettings(); break;
    default: app.innerHTML=renderHome(); bindHome();
  }
  // Update nav highlight
  renderNav();
}

    {id:'progress',icon:'📊',ic:'#06b6d4',title:'进度图表',desc:'WPM趋势折线图，追踪进步轨迹'},

  return `

      <h1>你好，${getCurrentUser()?.username || '同学'} 👋</h1>
      <p>${streak>0?`已经连续练习 ${streak} 天了，继续加油！`:'今天开始第一次练习吧！'}</p>

    <div class="home-top">
      <div class="goal-card">
        <h3>🎯 今日目标 <span style="font-size:.75rem;color:var(--muted);font-weight:normal;margin-left:8px">${dailyGoal} 分钟</span></h3>

  const title=document.getElementById('importTitle').value.trim();

function startSentPractice(idx){
  const all=getAllSentences();
  let list = all.slice(idx).concat(all.slice(0,idx));
  if(shuffleSentences){

  }

  html+='</div>';
  html+=`<div class="realtime-stats">

  setTimeout(()=>{

    if(display){
      display.focus();
      display.addEventListener('keydown',onDirectTypingKeydown);
      display.addEventListener('keypress',onDirectTypingKeypress);
    }
  },0);
  return html;
}
function onDirectTypingKeypress(e){
  if(typingState.finished||typingState.paused)return;
  // Ignore if modifier keys are pressed (e.g. Ctrl+C, Cmd+A)
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  // Start timer on first keystroke
  startTypingTimerIfNeeded();
  const text=getCurrentText();
  const pos=typingState.typed.length;
  if(pos>=text.length)return;
  const ch=String.fromCharCode(e.charCode||e.keyCode);
  if(!ch||ch.length!==1)return;
  e.preventDefault();
  typingState.typed+=ch;
  // Track error keys
  if(ch!==text[pos]){
    const u = getUserData();
    const errKey = text[pos]===' '?'SPACE':text[pos];
    u.errorKeys = u.errorKeys || {};
    u.errorKeys[errKey] = (u.errorKeys[errKey]||0)+1;
  }
  renderTypingTextOnly();
  updateTypingStats();
  if(typingState.typed.length>=text.length){
    finishTyping();
  }
}
function onDirectTypingKeydown(e){
  if(typingState.finished)return;
  // Space key resumes from pause
  if(e.key===' '&&typingState.paused){
    e.preventDefault();
    toggleTypingPause();
    return;
  }
  if(typingState.paused)return;
  // Backspace
  if(e.key==='Backspace'){
    e.preventDefault();
    if(typingState.typed.length>0){
      typingState.typed=typingState.typed.slice(0,-1);
      typingState.backspaces++;
      renderTypingTextOnly();
      updateTypingStats();
    }
    return;
  }
  // Enter key skips paragraph break in full mode
  if(e.key==='Enter'&&typingMode==='full'){
    e.preventDefault();
    const text=getCurrentText();
    const pos=typingState.typed.length;
    let nextPos=pos;
    while(nextPos<text.length&&(text[nextPos]==='\n'||text[nextPos]==='\r'||text[nextPos]===' ')){
      nextPos++;
    }
    if(nextPos>pos){
      typingState.typed=text.substring(0,nextPos);
      renderTypingTextOnly();
      updateTypingStats();
      if(nextPos>=text.length){
        finishTyping();
      }
    }
    return;
  }
  // Prevent default for printable chars (handled by keypress)
  // but allow navigation keys to pass through naturally
}
function startTypingTimerIfNeeded(){
  if(typingState.startTime)return;
  typingState.startTime=Date.now();
  typingState.timer=setInterval(updateTypingStats,200);
  const toolbar=document.querySelector('.typing-toolbar');
  if(toolbar){
    const btn=document.createElement('button');
    btn.className='pause-btn';
    btn.textContent='⏸ 暂停';

}
function renderTypingTextOnly(){

}
function updateTypingStats(){
  if(!typingState.startTime||typingState.paused)return;

  const min=Math.floor(elapsed/60),sec=Math.floor(elapsed%60);

function toggleTypingPause(){

      <h3 style="margin-bottom:16px">词汇练习完成！</h3>
      <div class="realtime-stats" style="max-width:400px;margin:0 auto 20px">
        <div class="rt-stat"><div class="v">${vocabState.correct}</div><div class="l">正确数</div></div>
        <div class="rt-stat"><div class="v">${acc}%</div><div class="l">正确率</div></div>
        <div class="rt-stat"><div class="v">${Math.floor(elapsed/60)}:${(elapsed%60)<10?'0':''}${Math.floor(elapsed%60)}</div><div class="l">用时</div></div>
      </div>
      ${vocabState.errorWords.length?`<p style="color:var(--danger);font-size:.85rem;margin-bottom:16px">错误单词：${vocabState.errorWords.join(', ')}</p>`:''}
      <div style="display:flex;gap:12px;justify-content:center">
        <button class="btn-ghost" style="padding:8px 20px;border-radius:8px" onclick="initVocab()">再来一组</button>
        <button class="btn-primary" style="padding:8px 20px;border-radius:8px" onclick="navigate('home')">返回首页</button>
      </div>
    `;
    // Save record
    const record={
      id:'p'+Date.now(),
      date:new Date().toLocaleDateString('zh-CN'),
      timestamp:Date.now(),
      mode:'词汇专项',
      essayTitle:'高频词汇练习',
      wpm:0,
      accuracy:acc,
      duration:Math.round(elapsed),
      totalChars:vocabState.total,
      correctChars:vocabState.correct,
      errorChars:vocabState.total-vocabState.correct,
      backspaces:0,
      wordCount:vocabState.total,
      errors:[],
    };
    addPracticeRecord(record);
    saveStore(store);
    return;
  }
  const item=vocabState.list[vocabState.index];
  area.innerHTML=`
    <div class="vocab-word">${item.w}</div>
    <div class="vocab-def">${item.pos} ${item.def} · 托福写作高频词</div>

    <div class="vocab-hint" id="vocabHint"></div>
    <div class="vocab-prog">
      第 ${vocabState.index+1} / ${vocabState.total} 个 · 正确率 ${vocabState.total>0?Math.round((vocabState.correct/(vocabState.index+1))*100):100}%
      <div class="vocab-bar"><div class="vocab-bar-fill" style="width:${(vocabState.index/vocabState.total)*100}%"></div></div>
    </div>
  `;
  const input=document.getElementById('vocabInput');
  input.focus();
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      if(input.value.trim()===item.w){
        vocabState.correct++;
        vocabState.index++;
        renderVocabWord();
      }else{
        input.classList.add('err');
        document.getElementById('vocabHint').textContent='正确拼写：'+item.w;
        vocabState.errorWords.push(item.w);
        addToWrongBook(item.w);
        setTimeout(()=>{
          input.value='';
          input.classList.remove('err');
          document.getElementById('vocabHint').textContent='';
          vocabState.index++;
          renderVocabWord();
        },1500);
      }
    }
  });
}

function initKbPractice(){
  kbState={text:KB_PRACTICE[Math.floor(Math.random()*KB_PRACTICE.length)],pos:0,correct:0,total:0};
  renderKbText();
  document.addEventListener('keydown',onKbKeydown);
}
function renderKbText(){
  const el=document.getElementById('kbPracText');
  if(!el)return;
  const t=kbState.text;
  let html='';
  for(let i=0;i<t.length;i++){
    if(i===kbState.pos)html+=`<span class="nc">${t[i]===' '?'␣':t[i]}</span>`;
    else html+=t[i]===' '?'&nbsp;':t[i];
  }
  el.innerHTML=html;
  // Highlight next key
  document.querySelectorAll('.kb-key').forEach(k=>k.classList.remove('next'));
  if(kbState.pos<t.length){
    const nextCh=t[kbState.pos].toLowerCase();
    const keyEl=document.querySelector(`.kb-key[data-key="${nextCh}"]`);
    if(keyEl)keyEl.classList.add('next');
  }
  // Stats
  const stats=document.getElementById('kbStats');
  if(stats)stats.textContent=`进度 ${kbState.pos}/${t.length} · 准确率 ${kbState.total>0?Math.round(kbState.correct/kbState.total*100):100}%`;
}
function onKbKeydown(e){
  if(currentView!=='keyboard')return;
  if(!kbState)return;
  const key=e.key.toLowerCase();
  // Highlight pressed key
  const keyEl=document.querySelector(`.kb-key[data-key="${key===' '?' ':key}"]`);
  if(keyEl){
    keyEl.classList.add('act');
    setTimeout(()=>keyEl.classList.remove('act'),120);
  }
  if(kbState.pos<kbState.text.length){
    const expected=kbState.text[kbState.pos].toLowerCase();
    kbState.total++;
    if(key===expected){
      kbState.correct++;
      kbState.pos++;
      if(kbState.pos>=kbState.text.length){
        // Completed
        setTimeout(()=>{
          toast('完成！准确率 '+Math.round(kbState.correct/kbState.total*100)+'%');
          nextKbText();
        },300);
      }
    }
    renderKbText();
  }
}
function nextKbText(){
  kbState={text:KB_PRACTICE[Math.floor(Math.random()*KB_PRACTICE.length)],pos:0,correct:0,total:0};
  renderKbText();
}

    clearInterval(examState.timer);
    examState.running=false;
    btn.textContent='继续倒计时';

// ==================== EXAM SCORING ====================
function scoreExam(text, mode, question){
  const words = text.trim().split(/\s+/).filter(w=>w.length>0);
  const wordCount = words.length;
  const sentences = text.split(/[.!?]+/).filter(s=>s.trim().length>0);
  const sentenceCount = sentences.length;
  // Dimension scores (0-1.2 each, total 6.0)
  let d1=1.2, d2=1.2, d3=1.2, d4=1.2, d5=1.2;
  const reasons = [];

  // 1. Content elaboration
  if(wordCount<80){d1-=0.5;reasons.push('字数不足，内容展开不充分');}
  else if(wordCount<100){d1-=0.3;reasons.push('字数略少，建议进一步展开论点');}
  if(mode==='email'){
    if(!/\b(dear|hi|hello)\b/i.test(text)){d1-=0.2;reasons.push('邮件缺少称呼');}
    if(!/\b(regards|sincerely|best|thanks|thank you)\b/i.test(text)){d1-=0.2;reasons.push('邮件缺少结尾礼貌用语');}
  }
  if(mode==='debate'){
    if(!/\b(student|classmate|argue|believe|think|point)\b/i.test(text)){d1-=0.3;reasons.push('辩论写作中缺少对同学观点的引用');}
    if(!/\b(i agree|i disagree|in my opinion|i believe|i think|personally)\b/i.test(text)){d1-=0.3;reasons.push('辩论写作中缺少明确的个人论断');}
  }

  // 2. Syntactic variety
  const sentLens = sentences.map(s=>s.trim().split(/\s+/).filter(w=>w.length>0).length).filter(l=>l>0);
  const avgLen = sentLens.length>0 ? sentLens.reduce((a,b)=>a+b,0)/sentLens.length : 0;
  const variance = sentLens.length>1 ? sentLens.reduce((s,l)=>s+Math.pow(l-avgLen,2),0)/sentLens.length : 0;
  const connectors = /\b(however|therefore|moreover|furthermore|although|because|while|despite|in addition|consequently|thus|nevertheless)\b/gi;
  const connectorCount = (text.match(connectors)||[]).length;
  if(sentenceCount<3){d2-=0.3;reasons.push('句式数量太少，缺乏多样性');}
  else if(variance<4){d2-=0.2;reasons.push('句子长度过于均匀，建议长短句交替');}
  if(connectorCount<1){d2-=0.2;reasons.push('缺少连接词，句间逻辑不够清晰');}
  const complexSent = /\b(which|that|who|whose|whom|where|when|although|because|since|while|if|unless)\b/gi;
  const complexCount = (text.match(complexSent)||[]).length;
  if(complexCount<1 && sentenceCount>1){d2-=0.2;reasons.push('缺少复合句，全篇简单句影响表达层次');}

  // 3. Word choice precision
  const commonErrors = [
    {pat:/\b(very good|very bad|very nice|very big|very small)\b/gi,d:0.1,r:'使用了过于基础的词汇搭配'},
    {pat:/\b(a lot of|lots of)\b/gi,d:0.1,r:'建议用 more formal 替代 a lot of'},
    {pat:/\b(thing|things)\b/gi,d:0.05,r:'thing 过于笼统'},
    {pat:/\b(good|bad|big|small|nice)\b/gi,d:0.05,r:'可使用更精准的形容词'},
  ];
  let wordChoiceDeduction = 0;
  let wordChoiceNotes = [];
  commonErrors.forEach(e=>{
    const c=(text.match(e.pat)||[]).length;
    if(c>0){wordChoiceDeduction+=e.d*Math.min(c,3);wordChoiceNotes.push(e.r);}
  });
  d3 = Math.max(0.3, d3-wordChoiceDeduction);
  if(wordChoiceNotes.length>0) reasons.push(wordChoiceNotes[0]);

  // 4. Social conventions
  if(mode==='email'){
    if(!/\b(dear|hi|hello)\s+\w+/i.test(text)){d4-=0.3;reasons.push('邮件缺少正式称呼（如 Dear Professor...）');}
    if(!/\b(sincerely|best regards|best|respectfully|thank you)\s*\n/i.test(text) && !/\b(sincerely|best regards|best|respectfully|thank you)\s*$/i.test(text.trim())){d4-=0.3;reasons.push('邮件缺少正式结尾');}
    if(!/\b(please|could you|would you|i would like to|i am writing to)\b/i.test(text)){d4-=0.2;reasons.push('语气不够礼貌正式');}
  }
  if(mode==='debate'){
    if(!/\b(student a|student b|first student|second student|the first|the second|classmate)\b/i.test(text) && !/\b(argue|believe|points out|states|claims)\b/i.test(text)){d4-=0.3;reasons.push('缺少对同学观点的明确引用和总结');}
    if(!/\b(i agree|i disagree|in my view|from my perspective|personally|i would argue)\b/i.test(text)){d4-=0.3;reasons.push('缺少明确表达个人立场的标志性用语');}
    if(sentenceCount<3){d4-=0.2;reasons.push('辩论写作结构不完整');}
  }

  // 5. Grammar accuracy
  let gramErrors = 0;
  const gramChecks = [
    {pat:/\b(he don't|she don't|it don't)\b/gi,r:'主谓一致错误'},
    {pat:/\b(i has|you has|he have|she have|it have)\b/gi,r:'主谓一致错误'},
    {pat:/\b(was you|were he|were she|was they|were it)\b/gi,r:'be动词主谓一致'},
    {pat:/\b(a apple|a university|an book|an car)\b/gi,r:'冠词使用错误'},
    {pat:/\b\d+\s+(year|month|day|hour|minute)\s+old\b/gi,r:null},
    {pat:/\b(could of|would of|should of|must of)\b/gi,r:'情态动词 + of 错误'},
    {pat:/\b(there going to|their going to)\b/gi,r:'there/their 混淆'},
    {pat:/\b(your welcome|your right|your wrong)\b/gi,r:'your/you\'re 混淆'},
    {pat:/\b(a another)\b/gi,r:'冗余冠词'},
    {pat:/\b(more better|more easier|most biggest)\b/gi,r:'比较级/最高级冗余'},
  ];
  const gramNotes = [];
  gramChecks.forEach(g=>{
    const c=(text.match(g.pat)||[]).length;
    if(c>0 && g.r){gramErrors+=c;gramNotes.push(g.r);}
  });
  // Tolerance for common typos
  const typoWords = /\b(there|their|your|you're|its|it's|than|then|to|too|lose|loose|affect|effect)\b/gi;
  const typoCount = (text.match(typoWords)||[]).length;
  if(gramErrors>=1) d5-=Math.min(0.4, gramErrors*0.1);
  if(gramNotes.length>0) reasons.push('语法：'+gramNotes[0]);

  // Clamp
  d1=Math.max(0.2,d1);d2=Math.max(0.2,d2);d3=Math.max(0.2,d3);d4=Math.max(0.2,d4);d5=Math.max(0.2,d5);
  const total = d1+d2+d3+d4+d5;
  const level = total>=5?'优秀':total>=4?'良好':total>=3?'合格':total>=2?'待改进':'不及格';

  return {
    total: total.toFixed(1),
    level,
    dimensions: [
      {name:'内容展开',score:d1.toFixed(1),max:1.2},
      {name:'句法多样性',score:d2.toFixed(1),max:1.2},
      {name:'用词精准度',score:d3.toFixed(1),max:1.2},
      {name:'社交规范',score:d4.toFixed(1),max:1.2},
      {name:'语法准确度',score:d5.toFixed(1),max:1.2},
    ],
    wordCount,
    sentenceCount,
    reasons: reasons.length>0 ? reasons : ['表达基本清晰，继续保持'],
  };
}

function drawProgressChart(){
  const canvas=document.getElementById('progressChart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth,h=350;
  canvas.width=w*dpr;canvas.height=h*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const p=getUserData().practices.filter(x=>x.wpm>0).slice(-14);
  if(!p.length)return;
  const data=p.map(x=>x.wpm);
  const maxWpm=Math.max(...data,getUserData().settings.targetWpm||30,40);
  const padL=50,padR=30,padT=30,padB=50;
  const chartW=w-padL-padR,chartH=h-padT-padB;
  // Grid
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;
  ctx.font='11px system-ui';ctx.fillStyle='#64748b';
  const ySteps=5;
  for(let i=0;i<=ySteps;i++){
    const y=padT+chartH*(i/ySteps);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke();
    const val=Math.round(maxWpm*(1-i/ySteps));
    ctx.textAlign='right';ctx.fillText(val,padL-8,y+4);
  }
  // Target line
  const targetWpm=getUserData().settings.targetWpm||30;
  const targetY=padT+chartH*(1-targetWpm/maxWpm);
  ctx.strokeStyle='#22c55e';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.moveTo(padL,targetY);ctx.lineTo(w-padR,targetY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#22c55e';ctx.textAlign='left';ctx.fillText('目标 '+targetWpm,w-padR-80,targetY-6);
  // Line
  ctx.strokeStyle='#4f6ef7';ctx.lineWidth=2.5;
  ctx.beginPath();
  data.forEach((v,i)=>{
    const x=padL+chartW*(p.length===1?0.5:i/(data.length-1));
    const y=padT+chartH*(1-v/maxWpm);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  // Area
  ctx.lineTo(padL+chartW,y=padT+chartH);
  ctx.lineTo(padL,padT+chartH);
  ctx.closePath();
  ctx.fillStyle='rgba(79,110,247,0.08)';ctx.fill();
  // Points
  data.forEach((v,i)=>{
    const x=padL+chartW*(p.length===1?0.5:i/(data.length-1));
    const y=padT+chartH*(1-v/maxWpm);
    ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);
    ctx.fillStyle='#4f6ef7';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  });
  // X labels
  ctx.fillStyle='#64748b';ctx.textAlign='center';
  const labelStep=Math.max(1,Math.floor(data.length/7));
  data.forEach((v,i)=>{
    if(i%labelStep!==0&&i!==data.length-1)return;
    const x=padL+chartW*(p.length===1?0.5:i/(data.length-1));
    const d=new Date(p[i].timestamp);
    ctx.fillText(d.getMonth()+1+'/'+d.getDate(),x,h-padB+18);
  });
}

// ==================== ERROR ANALYSIS ====================
function renderErrors(){
  const errMap={};
  getUserData().practices.forEach(p=>{
    if(p.errors){
      p.errors.forEach(e=>{
        const key=e.expected?e.expected.toLowerCase():'?';
        if(key.match(/[a-z0-9 ,.]/)){
          errMap[key]=(errMap[key]||0)+1;
        }
      });
    }
  });
  // Also count from errorChars — we don't have per-key for old records, simulate from stored errors
  const sorted=Object.entries(errMap).sort((a,b)=>b[1]-a[1]);
  const top5=sorted.slice(0,5);
  const maxErr=sorted.length?sorted[0][1]:1;
  const errRows=[
    'qwertyuiop'.split(''),
    'asdfghjkl'.split(''),
    'zxcvbnm'.split('')
  ];
  function errColor(ch){
    const count=errMap[ch]||0;
    if(count===0)return '#e2e8f0';
    const intensity=0.3+0.7*(count/maxErr);
    return `rgba(239,68,68,${intensity})`;
  }
  return `
    <div class="back-btn" onclick="navigate('home')">← 返回首页</div>
    <div class="section-title">易错键分析</div>
    <div class="report-area">
      ${!sorted.length?'<div class="empty"><div class="emoji">🎉</div><p>暂无错误数据，继续练习后再来看看</p></div>':`
      <h4 style="font-size:.9rem;color:var(--accent);margin-bottom:16px">键盘错误热力图</h4>
      <div class="err-kb">
        ${errRows.map(row=>`<div class="kb-row">${row.map(ch=>{
          const count=errMap[ch]||0;
          return `<div class="err-key" style="background:${errColor(ch)};color:${count===0?'#94a3b8':'#fff'}">${ch.toUpperCase()}${count>0?`<span class="ec">${count}</span>`:''}</div>`;
        }).join('')}</div>`).join('')}
      </div>
      <h4 style="font-size:.9rem;color:var(--accent);margin-bottom:16px">错误次数 Top 5</h4>
      <div class="err-top">
        ${top5.map(([ch,count])=>`
          <div class="err-top-card">
            <div class="k">${ch===' '?'空格':ch.toUpperCase()}</div>
            <div class="c">${count} 次错误</div>
          </div>
        `).join('')}
        ${top5.length<5?Array(5-top5.length).fill('<div class="err-top-card"><div class="k" style="color:#cbd5e1">—</div><div class="c">—</div></div>').join(''):''}
      </div>
      <p style="font-size:.82rem;color:var(--muted);margin-top:16px;text-align:center">热力图基于所有历史练习的累计错误统计，颜色越深表示错误越多</p>
      `}
    </div>
  `;
}

function addUser(){
  const name = document.getElementById('newUserName').value.trim();
  const pwd = document.getElementById('newUserPwd').value;
  const expNum = parseInt(document.getElementById('newUserExpireNum').value)||30;
  const expUnit = document.getElementById('newUserExpireUnit').value;
  const role = document.getElementById('newUserRole').value;
  if(!name){toast('请输入用户名');return;}
  if(pwd.length < MIN_PWD_LEN){toast(`密码至少 ${MIN_PWD_LEN} 位`);return;}
  if(expNum < 1){toast('有效期至少 1 天');return;}
  const id = 'u_'+Date.now();
  store.users[id] = defaultUserObj(name, role, computeExpireCustom(expNum, expUnit));
  store.users[id].password = hashPwd(pwd);
  saveStore(store);
  toast('添加成功');
  renderView();
}
function resetUserPwd(id){
  const pwd = prompt('请输入新密码：');
  if(!pwd) return;
  if(pwd.length < MIN_PWD_LEN){toast(`密码至少 ${MIN_PWD_LEN} 位`);return;}
  store.users[id].password = hashPwd(pwd);
  saveStore(store);
  toast('密码已重置');
}
function extendUser(id){
  const numStr = prompt('请输入延长期限（数字）：\n例如：7 = 7天，30 = 30天，3 = 3个月，1 = 1年', '30');
  if(!numStr) return;
  const num = parseInt(numStr);
  if(isNaN(num) || num < 1){toast('请输入有效的数字');return;}
  const unitStr = prompt('请选择单位：\n1) 天\n2) 月\n3) 年\n4) 永不过期', '1');
  if(!unitStr) return;
  let expireAt;
  if(unitStr === '4'){
    expireAt = 'never';
  }else{
    const unitMap = {'1':'day','2':'month','3':'year'};
    const unit = unitMap[unitStr];
    if(!unit){toast('无效选择');return;}
    expireAt = computeExpireCustom(num, unit);
  }
  store.users[id].expireAt = expireAt;
  saveStore(store);
  toast('已更新有效期');
  renderView();
}
function deleteUser(id){
  if(!confirm('确定删除该用户？其所有数据将被清除。')) return;
  delete store.users[id];
  saveStore(store);
  toast('已删除');
  renderView();
}
function toggleBatchImport(){
  const area = document.getElementById('batchImportArea');
  if(area) area.style.display = area.style.display==='none' ? 'block' : 'none';
}
function doBatchImport(){
  const text = document.getElementById('batchImportText').value.trim();
  if(!text){toast('请输入用户数据');return;}
  const lines = text.split('\n').filter(l=>l.trim());
  let success = 0, fail = 0;
  lines.forEach(line=>{
    const parts = line.split(',').map(s=>s.trim());
    if(parts.length < 2){fail++;return;}
    const [name, pwd, expireRaw] = parts;
    if(!name || !pwd || pwd.length < MIN_PWD_LEN){fail++;return;}
    let expireAt;
    if(expireRaw==='never' || !expireRaw){
      expireAt = 'never';
    } else {
      const days = parseInt(expireRaw);
      if(isNaN(days) || days < 1){fail++;return;}
      const d = new Date();
      d.setDate(d.getDate()+days);
      expireAt = d.toISOString();
    }
    const id = 'u_'+Date.now()+'_'+Math.random().toString(36).substring(2,6);
    store.users[id] = defaultUserObj(name, 'user', expireAt);
    store.users[id].password = hashPwd(pwd);
    success++;
  });
  saveStore(store);
  toast(`成功导入 ${success} 个，失败 ${fail} 个`);
  renderView();
}

// ==================== SHARE CODE (更新码) ====================
function generateShareCode(){
  const data = {
    v: 3,
    essays: store.shared.essays,
    vocab: store.shared.vocab,
    sentences: store.shared.sentences,
    examQuestions: store.shared.examQuestions || DEFAULT_EXAM_QUESTIONS,
    ts: Date.now(),
  };
  const json = JSON.stringify(data);
  const compressed = lzCompress(json);
  return 'TY' + compressed;
}
function parseShareCode(code){
  try{
    if(!code) return null;
    // v3+: LZ compressed (TY + compressed string)
    if(code.startsWith('TY') && !code.startsWith('TYe') && code.length < 200){
      const compressed = code.substring(2);
      const json = lzDecompress(compressed);
      if(json){
        const data = JSON.parse(json);
        if(data.essays && data.vocab) return data;
      }
    }
    // v1/v2: Base64 (legacy, fallback)
    if(code.startsWith('TY')){
      const b64 = code.substring(2);
      const json = decodeURIComponent(escape(atob(b64)));
      const data = JSON.parse(json);
      if(!data.essays || !data.vocab || !data.sentences) return null;
      return data;
    }
    return null;
  }catch(e){
    return null;
  }
}
function applyShareCode(code){
  const data = parseShareCode(code);
  if(!data){toast('更新码无效，请检查');return false;}
  store.shared.essays = data.essays;
  store.shared.vocab = data.vocab;
  store.shared.sentences = data.sentences;
  if(data.examQuestions) store.shared.examQuestions = data.examQuestions;
  saveStore(store);
  toast('共享素材已更新！');
  return true;
}

function drawDashboardChart(){
  const canvas = document.getElementById('dashWpmChart');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  loadReportedData();
  // Collect all WPM data from all users (last 14 days avg per day)
  const dailyData = {}; // { 'MM-DD': { total: 0, count: 0 } }
  const addPractice = (p) => {
    if(!p || !p.date || !p.wpm) return;
    const key = p.date.substring(5); // MM-DD
    if(!dailyData[key]) dailyData[key] = {total:0,count:0};
    dailyData[key].total += p.wpm;
    dailyData[key].count++;
  };
  Object.values(store.users).forEach(u=>(u.practices||[]).slice(-30).forEach(addPractice));
  Object.values(reportedData).forEach(r=>(r.recentWpm||[]).forEach(d=>addPractice(d)));
  // Sort by date
  const sorted = Object.entries(dailyData).sort((a,b)=>a[0].localeCompare(b[0])).slice(-14);
  const data = sorted.map(([date,d])=>({label:date, wpm:Math.round(d.total/d.count)}));

  if(data.length === 0){
    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据', canvas.width/2, canvas.height/2);
    return;
  }
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 700 * dpr;
  canvas.height = 260 * dpr;
  ctx.scale(dpr, dpr);
  const W = 700, H = 260;
  const pad = {l:50, r:20, t:20, b:40};
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;
  const maxWpm = Math.max(...data.map(x=>x.wpm), 10);
  const yMax = Math.ceil(maxWpm / 10) * 10 + 5;
  // Grid
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'right';
  for(let i=0;i<=5;i++){
    const y = pad.t + ch/5*i;
    const val = Math.round(yMax - yMax/5*i);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(W-pad.r, y);
    ctx.stroke();
    ctx.fillText(val, pad.l-8, y+4);
  }
  // X labels
  ctx.textAlign = 'center';
  data.forEach((pt,i)=>{
    const x = pad.l + cw * (data.length===1?0.5:i/(data.length-1));
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(pt.label, x, H-pad.b+16);
  });
  // Bar chart
  const barW = Math.min(36, cw/data.length * 0.7);
  data.forEach((pt,i)=>{
    const x = pad.l + cw * (data.length===1?0.5:i/(data.length-1)) - barW/2;
    const y = pad.t + ch * (1 - pt.wpm/yMax);
    const h = ch * pt.wpm/yMax;
    const grd = ctx.createLinearGradient(0, y, 0, y+h);
    grd.addColorStop(0, '#4f6ef7');
    grd.addColorStop(1, '#818cf8');
    ctx.fillStyle = grd;
    ctx.fillRect(x, y, barW, h);
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    if(data.length <= 20) ctx.fillText(pt.wpm, x + barW/2, y - 6);
  });
}

function generateProjectReport(){
  loadReportedData();
  const allUsers = {};
  Object.entries(store.users).forEach(([uid,u])=>{
    const practices = u.practices || [];
    allUsers[u.username] = {
      name: u.username, role: u.role,
      totalPractices: practices.length,
      totalMinutes: Math.round((u.stats?.totalTime||0)/60),
      bestWpm: u.stats?.bestWpm || 0,
      avgWpm: practices.length>0 ? Math.round(practices.reduce((s,p)=>s+p.wpm,0)/practices.length) : 0,
      firstWpm: practices.length>0 ? practices[0].wpm : 0,
      examScores: practices.filter(p=>p.isExam&&p.examScore).map(p=>parseFloat(p.examScore.total)),
    };
  });
  Object.entries(reportedData).forEach(([name,d])=>{
    if(!allUsers[name]){
      allUsers[name] = {
        name, role:'user',
        totalPractices: d.stats?.totalPractices || 0,
        totalMinutes: d.stats?.totalMinutes || 0,
        bestWpm: d.stats?.bestWpm || 0,
        avgWpm: d.stats?.avgWpm || 0,
        firstWpm: (d.recentWpm&&d.recentWpm[0])?d.recentWpm[0].wpm:0,
        examScores: (d.examScores||[]).map(e=>e.score),
      };
    }
  });
  const userList = Object.values(allUsers);
  const active = userList.filter(u=>u.totalPractices>0);
  const totalPractices = userList.reduce((s,u)=>s+u.totalPractices,0);
  const totalMin = userList.reduce((s,u)=>s+u.totalMinutes,0);
  const avgWpm = active.length>0 ? Math.round(active.reduce((s,u)=>s+u.avgWpm,0)/active.length) : 0;
  const bestWpm = Math.max(...userList.map(u=>u.bestWpm),0);
  const allExamScores = userList.flatMap(u=>u.examScores||[]);
  const avgExamScore = allExamScores.length>0 ? (allExamScores.reduce((s,x)=>s+x,0)/allExamScores.length).toFixed(1) : '—';

  const report = `本项目共注册 ${userList.length} 名用户，其中活跃用户 ${active.length} 人，活跃率 ${active.length>0?Math.round(active.length/userList.length*100):0}%。

累计练习 ${totalPractices} 次，总练习时长 ${totalMin} 分钟，人均 ${active.length>0?Math.round(totalMin/active.length):0} 分钟。

用户平均打字速度为 ${avgWpm} WPM，最高速度 ${bestWpm} WPM。

模拟考试共完成 ${allExamScores.length} 次，平均得分 ${avgExamScore} / 6.0。

整体来看，用户参与度良好，打字速度和写作水平均有明显提升空间。建议继续保持练习频率，重点关注低活跃用户的激励和引导。`;

  const area = document.getElementById('projectReportArea');
  if(area){
    area.style.display = 'block';
    area.innerHTML = `
      <div style="background:var(--page-brand-soft);border-radius:12px;padding:20px;margin-top:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h3 style="font-size:1rem;margin:0">📝 项目成果报告</h3>
          <button onclick="copyProjectReport()" style="padding:6px 14px;border-radius:6px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:.82rem">📋 复制报告</button>
        </div>
        <textarea id="projectReportText" readonly style="width:100%;height:200px;padding:12px;border:1px solid var(--rule);border-radius:8px;font-size:.9rem;line-height:1.8;background:var(--card);color:var(--ink);resize:none;font-family:inherit">${report}</textarea>
      </div>
    `;
  }

function checkReminder(){
  const u = getCurrentUser();
  if(!u || !u.settings?.reminderEnabled) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const [h,m] = (u.settings.reminderTime||'19:00').split(':').map(Number);
  const today = new Date().toLocaleDateString('zh-CN');
  const lastKey = 'last_remind_'+today;
  if(sessionStorage.getItem(lastKey)) return;
  if(now.getHours() >= h && now.getMinutes() >= m){
    new Notification('托福打字练习', {body:'⏰ 到练习时间啦！今天的目标完成了吗？'});
    sessionStorage.setItem(lastKey, '1');
  }

function drawReportChart(){
  const canvas = document.getElementById('reportChart');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const u = getUserData();
  const p = (u.practices||[]).slice(-reportTimeRange);
  if(p.length === 0){
    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据', canvas.width/2, canvas.height/2);
    return;
  }
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 700 * dpr;
  canvas.height = 280 * dpr;
  ctx.scale(dpr, dpr);
  const W = 700, H = 280;
  const pad = {l:50, r:20, t:30, b:40};
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;
  const maxWpm = Math.max(...p.map(x=>x.wpm), 10);
  const yMax = Math.ceil(maxWpm / 10) * 10 + 5;
  // Grid
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'right';
  for(let i=0;i<=5;i++){
    const y = pad.t + ch/5*i;
    const val = Math.round(yMax - yMax/5*i);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(W-pad.r, y);
    ctx.stroke();
    ctx.fillText(val, pad.l-8, y+4);
  }
  // X labels
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(p.length/7));
  p.forEach((pt,i)=>{
    if(i%step===0 || i===p.length-1){
      const x = pad.l + cw * (p.length===1?0.5:i/(p.length-1));
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(pt.date.substring(5), x, H-pad.b+16);
    }
  });
  // Target line
  const target = u.settings?.targetWpm || 30;
  if(target <= yMax){
    const ty = pad.t + ch * (1 - target/yMax);
    ctx.strokeStyle = '#22c55e';
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(pad.l, ty);
    ctx.lineTo(W-pad.r, ty);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#22c55e';
    ctx.textAlign = 'left';
    ctx.fillText('目标 ' + target, W-pad.r-60, ty-6);
  }
  // Data
  if(reportChartType === 'line'){
    // Line
    ctx.strokeStyle = '#4f6ef7';
    ctx.lineWidth = 2;
    ctx.beginPath();
    p.forEach((pt,i)=>{
      const x = pad.l + cw * (p.length===1?0.5:i/(p.length-1));
      const y = pad.t + ch * (1 - pt.wpm/yMax);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    // Dots
    p.forEach((pt,i)=>{
      const x = pad.l + cw * (p.length===1?0.5:i/(p.length-1));
      const y = pad.t + ch * (1 - pt.wpm/yMax);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#4f6ef7';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  } else {
    // Bar
    const barW = Math.min(30, cw/p.length * 0.6);
    p.forEach((pt,i)=>{
      const x = pad.l + cw * (p.length===1?0.5:i/(p.length-1)) - barW/2;
      const y = pad.t + ch * (1 - pt.wpm/yMax);
      const h = ch * pt.wpm/yMax;
      const grd = ctx.createLinearGradient(0, y, 0, y+h);
      grd.addColorStop(0, '#4f6ef7');
      grd.addColorStop(1, '#818cf8');
      ctx.fillStyle = grd;
      ctx.fillRect(x, y, barW, h);
    });
  }
  // Value labels on top of bars/line
  ctx.fillStyle = '#1e293b';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  p.forEach((pt,i)=>{
    const x = pad.l + cw * (p.length===1?0.5:i/(p.length-1));
    const y = pad.t + ch * (1 - pt.wpm/yMax) - 8;
    if(p.length <= 15) ctx.fillText(pt.wpm, x, y);
  });
}

function isLocked(){

  root.innerHTML = `

        <input type="password" id="loginPwd" placeholder="输入指令码…" ${locked?'disabled':''} autocomplete="off">
        <button class="btn-login" id="loginBtn" ${locked?'disabled style="opacity:.5;cursor:not-allowed"':''}>登 录</button>
        <div class="err-msg" id="loginErr"></div>
        <p class="hint">连续输错 ${MAX_FAILS} 次将锁定 1 分钟<br>密码至少 ${MIN_PWD_LEN} 位</p>
        <div style="margin-top:14px;border-top:1px solid var(--rule);padding-top:14px;text-align:center">
          <a href="javascript:void(0)" onclick="showImportAccountModal()" style="font-size:.82rem;color:var(--accent);text-decoration:none">📋 导入账号码</a>
        </div>
      </div>
    </div>
  `;
  if(!locked){
    setTimeout(()=>{
      const pwd = document.getElementById('loginPwd');
      const btn = document.getElementById('loginBtn');
      pwd.focus();
      pwd.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
      btn.addEventListener('click', doLogin);
    }, 0);
  }else{
    // auto refresh after unlock
    setTimeout(renderLogin, 1000);
  }
}

function doLogin(){
  const pwd = document.getElementById('loginPwd').value;
  const errEl = document.getElementById('loginErr');
  if(pwd.length < MIN_PWD_LEN){
    errEl.textContent = `密码至少 ${MIN_PWD_LEN} 位`;
    return;
  }
  // Find user by password
  const hashed = hashPwd(pwd);
  const userId = Object.keys(store.users).find(uid => store.users[uid].password === hashed);
  if(!userId){
    store.loginState.fails++;
    if(store.loginState.fails >= MAX_FAILS){
      store.loginState.lockedUntil = Date.now() + LOCK_DURATION;
      store.loginState.fails = 0;
      saveStore(store);
      renderLogin();
      return;
    }
    saveStore(store);
    errEl.textContent = `指令码错误，还剩 ${MAX_FAILS - store.loginState.fails} 次机会`;
    return;
  }
  // Check expiration
  const user = store.users[userId];
  if(user.expireAt && user.expireAt !== 'never'){
    const expDate = new Date(user.expireAt);
    if(expDate < new Date()){
      errEl.textContent = '该账号已过期，请联系管理员';
      return;
    }
  }
  // Login success
  store.currentUserId = userId;
  store.loginState.fails = 0;
  store.loginState.lockedUntil = 0;
  saveStore(store);
  enterApp();
}
